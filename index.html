<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>С Днём Святого Валентина ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #fef6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02), 0 8px 20px rgba(255, 105, 180, 0.1);
            padding: 30px 24px;
            margin: 16px;
            text-align: center;
            transition: opacity 0.4s ease;
        }

        h1 {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #2d2d2d;
            margin-bottom: 20px;
        }

        h1 span {
            font-weight: 600;
            background: linear-gradient(135deg, #ff7b9c, #ff9eb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .page.hidden {
            display: none;
        }

        .question-title {
            font-size: 22px;
            font-weight: 400;
            color: #2d2d2d;
            margin-bottom: 16px;
        }

        .question-emoji {
            font-size: 48px;
            margin-bottom: 24px;
            animation: softPulse 2s infinite;
        }

        @keyframes softPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .math-question {
            background: #fafafa;
            border-radius: 32px;
            padding: 32px 20px;
            margin-bottom: 24px;
            border: 1px solid #fff0f5;
            width: 100%;
        }

        .question-text {
            font-size: 42px;
            font-weight: 500;
            color: #ff7b9c;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .answer-input {
            width: 120px;
            height: 60px;
            text-align: center;
            font-size: 32px;
            font-weight: 400;
            border: 2px solid #ffe2eb;
            border-radius: 30px;
            outline: none;
            color: #ff4d6d;
            background: white;
            margin-bottom: 20px;
            padding: 0 10px;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .answer-input::-webkit-outer-spin-button,
        .answer-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .answer-input:focus {
            border-color: #ffb6c1;
            box-shadow: 0 0 0 3px rgba(255, 180, 200, 0.2);
        }

        .check-btn {
            background: #ffe2ec;
            border: none;
            color: #ff4d6d;
            font-size: 18px;
            font-weight: 500;
            padding: 14px 32px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255, 128, 128, 0.2);
            border: 1px solid #ffd9e6;
            -webkit-tap-highlight-color: transparent;
            width: fit-content;
            margin: 0 auto;
        }

        .check-btn:active {
            background: #ffd3e0;
            transform: scale(0.97);
        }

        .error-message {
            color: #ff9eb5;
            font-size: 16px;
            margin-top: 16px;
            min-height: 24px;
            font-style: italic;
        }

        .days-page {
            text-align: center;
        }

        .days-number {
            font-size: 64px;
            font-weight: 500;
            background: linear-gradient(145deg, #ff4d6d, #ff8aa1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 16px 0 8px;
            line-height: 1;
        }

        .days-text {
            font-size: 22px;
            color: #2d2d2d;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .heart-image-container {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(255, 80, 120, 0.3));
        }

        .next-btn {
            background: #ffe2ec;
            border: none;
            color: #ff4d6d;
            font-size: 20px;
            font-weight: 500;
            padding: 16px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin: 30px 0 10px 0;
            box-shadow: 0 4px 12px rgba(255, 128, 128, 0.2);
            border: 1px solid #ffd9e6;
            -webkit-tap-highlight-color: transparent;
        }

        .next-btn:active {
            background: #ffd3e0;
            transform: scale(0.98);
        }

        .final-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .final-image-wrapper {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: 0 20px 30px rgba(255, 141, 161, 0.15);
            border: 3px solid white;
            background: #ffe2eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .final-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .love-message {
            font-size: 48px;
            font-weight: 350;
            color: #1f1f1f;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .love-message span {
            font-size: 56px;
            font-weight: 500;
            background: linear-gradient(145deg, #ff4d6d, #ff8aa1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .small-note {
            margin-top: 24px;
            font-size: 15px;
            color: #a0a0b0;
            font-style: italic;
        }

        .back-btn {
            background: white;
            border: 1.5px solid #ffe2eb;
            color: #ff7b9c;
            font-size: 17px;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 40px;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            background: #fff0f5;
            transform: scale(0.97);
        }

        .divider {
            width: 80px;
            height: 2px;
            background: #ffe3ec;
            margin: 20px auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page" id="questionPage">
            <h1><span>День Кили с Жабой</span></h1>
            <div class="question-emoji">🤔</div>
            <div class="math-question">
                <div class="question-text">194 + 645 =</div>
                <input type="number" id="answerInput" class="answer-input" placeholder="" inputmode="numeric">
                <button class="check-btn" id="checkAnswerBtn">Нучо</button>
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>

        <div class="page hidden" id="daysPage">
            <h1><span></span></h1>
            <div class="days-number">839</div>
            <div class="days-text">именно столько дней</div>
            
            <div class="heart-image-container">
                <img class="heart-image" src="https://cdn-icons-png.flaticon.com/512/2107/2107845.png" alt="красивое сердечко">
            </div>
            
            <div style="font-size: 18px; color: #8e8e98; margin-bottom: 20px;">мы с тобой уже вместе</div>
            <div class="divider"></div>
            <button class="next-btn" id="goToFinalBtn">Открыть послание</button>
        </div>

        <div class="page hidden" id="finalPage">
            <div class="final-image-wrapper">
                <img class="final-image" src="killya_and_jaba.jpeg" alt="" id="loveImage">
            </div>
            
            <div class="love-message">
                я очень люблю тебя
            </div>
            <div class="small-note">с нашим днем, счастье мое</div>
            <button class="back-btn" id="backToStartBtn">← Еще разок</button>
        </div>
    </div>

    <script>
        (function() {
            const correctAnswer = 839;
            
            const questionPage = document.getElementById('questionPage');
            const daysPage = document.getElementById('daysPage');
            const finalPage = document.getElementById('finalPage');
            
            const answerInput = document.getElementById('answerInput');
            const checkBtn = document.getElementById('checkAnswerBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            const goToFinalBtn = document.getElementById('goToFinalBtn');
            const backToStartBtn = document.getElementById('backToStartBtn');

            checkBtn.addEventListener('click', function() {
                const answer = parseInt(answerInput.value);
                
                if (answer === correctAnswer) {
                    questionPage.classList.add('hidden');
                    daysPage.classList.remove('hidden');
                    errorMessage.textContent = '';
                    answerInput.value = '';
                } else {
                    errorMessage.textContent = 'Слишком сложно?:) Попробуй снова, киса';
                    
                    answerInput.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        answerInput.style.transform = 'scale(1)';
                    }, 100);
                }
            });

            answerInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkBtn.click();
                }
            });

            goToFinalBtn.addEventListener('click', function() {
                daysPage.classList.add('hidden');
                finalPage.classList.remove('hidden');
            });

            backToStartBtn.addEventListener('click', function() {
                finalPage.classList.add('hidden');
                questionPage.classList.remove('hidden');
                errorMessage.textContent = '';
            });

            document.getElementById('loveImage').onerror = function() {
                this.style.backgroundColor = '#ffe2eb';
                this.src = '';
                this.alt = '❤️';
            };

            answerInput.focus();
        })();
    </script>
</body>
</html>
